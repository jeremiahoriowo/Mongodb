<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    .login-container {
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .login-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #6b7280;
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #4b5563;
      cursor: pointer;
    }

    .forgot-password {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    .signup-link {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .signup-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    #message {
      margin-top: 1rem;
      text-align: center;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
    }

    #message.success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    #message.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .nav-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
    }

    .nav-links a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Please enter your email and password to sign in</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>
    
    <p id="message"></p>

    <div class="signup-link">
      Don't have an account? <a href="register.html">Sign up here</a>
    </div>

    <div class="nav-links">
      <a href="register.html">Register</a> | <a href="update.html">Update</a> | <a href="delete.html">Delete</a>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        
        if (data.success) {
          messageEl.textContent = `Welcome back, ${data.user.username}! Login successful.`;
          messageEl.className = 'success';
          messageEl.style.display = 'block';
          
          setTimeout(() => {
            // Optional: redirect to a dashboard or home page
            alert('Login successful! You can now access other features.');
            document.getElementById('loginForm').reset();
          }, 2000);
        } else {
          messageEl.textContent = data.message;
          messageEl.className = 'error';
          messageEl.style.display = 'block';
        }
      } catch (error) {
        messageEl.textContent = 'An error occurred. Please try again.';
        messageEl.className = 'error';
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
